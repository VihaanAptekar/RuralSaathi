appId: com.ruralsaathi.app
productName: RuralSaathi
directories:
  output: dist-electron
  buildResources: build
files:
  - electron/**
  - server/src/**
  - server/package.json
  - client/dist/**
  - package.json
  - '!**/*.map'
  - '!server/data/**'
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - '**/*.node'
win:
  icon: build/icon.ico
  target:
    - target: nsis
    - target: portable
nsis:
  artifactName: RuralSaathi-Setup-${version}.${ext}
portable:
  artifactName: RuralSaathi-Portable-${version}.${ext}
