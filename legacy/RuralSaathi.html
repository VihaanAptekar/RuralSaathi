<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RuralSaathi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fa;--card:#fff;--tx:#202a35;--mut:#667384;--pri:#28639a;--pri2:#e8f1f8;--acc:#df9850;--bd:#e1e7ee;--bad:#b94d4b;--warn:#a96c18;--ok:#32765a;--on:#fff;--sh:0 1px 2px rgba(24,39,56,.04),0 10px 26px -16px rgba(24,39,56,.2)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand,.kpi div,.av{font-family:Manrope,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;background:linear-gradient(170deg,#1f6040,#0f3121);color:#eaf3e6}
.brand{font-size:22px;font-weight:700;display:flex;gap:10px;align-items:center;padding:4px 10px 26px;line-height:1.15}.brand small{display:block;font:400 12px Figtree,sans-serif;opacity:.7;margin-top:2px}
.nb{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 14px;border:0;border-radius:12px;background:none;color:#cfe0cb;cursor:pointer;font-weight:500;margin-bottom:4px}.nb span{font-size:18px}
.nb:hover{background:rgba(255,255,255,.09)}.nb.on{background:#f3eee1;color:#1d5a38;font-weight:700}.nb.out{margin-top:auto;color:#a9c4a5}
main{padding:34px clamp(16px,4vw,44px) 56px;max-width:1120px;width:100%}main.rise{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}@media(prefers-reduced-motion:reduce){main.rise{animation:none}}
h2{font-size:31px;margin:0 0 4px;letter-spacing:-.02em;font-weight:600;line-height:1.15}h3{margin:0 0 12px;font-size:18px;font-weight:600}
.sub{color:var(--mut);margin:0 0 24px;max-width:60ch}
button,select,input{font:inherit;color:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px 16px 22px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
.kpi small{color:var(--mut);font-size:13px}.kpi div{font-size:27px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;transition:transform .12s;box-shadow:0 6px 14px -8px var(--pri)}.btn:hover{transform:translateY(-1px)}
.btn.g{background:var(--card);color:var(--pri);border:1px solid var(--bd);box-shadow:none}
input,select{background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:500}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;padding:6px 0 12px}
details{border:1px solid var(--bd);border-radius:14px;padding:2px 16px;margin-bottom:10px;background:var(--bg)}details[open]{background:var(--card)}
summary{cursor:pointer;font-weight:600;padding:11px 0;color:var(--pri);list-style:none}summary::-webkit-details-marker{display:none}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-weight:600;font-size:12.5px}tr:last-child td{border-bottom:0}
tr.c{cursor:pointer}tr.c:hover{background:var(--pri2)}a{color:var(--pri);font-weight:600}
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--pri2);padding:4px;border-radius:14px;margin-bottom:18px}
.tb{border:0;background:none;padding:8px 18px;border-radius:10px;cursor:pointer;color:var(--mut);font-weight:600}.tb.on{background:var(--card);color:var(--pri);box-shadow:var(--sh)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.w{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.pill.b{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.mut{color:var(--mut)}.bar{height:10px;background:var(--pri2);border-radius:6px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pri),var(--acc))}
.hc{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;gap:14px}.hc:hover{transform:translateY(-3px)}.hc.st{cursor:default}.hc.st:hover{transform:none}.banner{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(120deg,#1f6040,#2c7a4b);color:#f6f1e4;border-radius:20px;padding:22px 26px;margin-bottom:18px}.banner .bt{font:600 25px Fraunces,Georgia,serif}.banner input{max-width:280px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}.banner input::placeholder{color:#d6e5d1}
.hc-top{display:flex;gap:12px;align-items:center}.hc-top b{display:block;font-size:16px}.hc-top small{color:var(--mut)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:600;background:var(--pri2);color:var(--pri);flex:none}.av.lg{width:64px;height:64px;font-size:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:2px 9px;color:var(--mut)}
.hc-foot{display:flex;justify-content:space-between;align-items:center}
.ring{--p:0;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--pri2) 0);display:grid;place-items:center;flex:none}
.ring i{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:600 12px Figtree,sans-serif;font-style:normal}
.ph{display:flex;gap:16px;align-items:center;margin:18px 0 20px;flex-wrap:wrap}.ph .chips{margin-top:2px}
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.hero{background:linear-gradient(160deg,#1f6040,#0c2a1c);color:#f3eee1;padding:48px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;min-height:340px}
.hero svg{position:absolute;inset:0 0 auto 0;width:100%;height:60%}.hero>*:not(svg){position:relative}
.hero h1{font-size:clamp(32px,4.4vw,48px);line-height:1.08;margin:0 0 14px;font-weight:600;letter-spacing:-.02em;max-width:13ch}.hero p{margin:4px 0;opacity:.85}
.pane{display:grid;place-items:center;padding:32px}.pane>div{max-width:340px}.pane .btn{width:100%;padding:13px;margin:16px 0 10px}
#toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:9}#toast.s{opacity:1}
@media(max-width:760px){.app{display:block}aside{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:18px 18px 0 0}
.brand{display:none}aside nav{display:flex;flex:1;gap:2px}.nb,.nb.out{flex-direction:column;gap:1px;font-size:11px;padding:6px 2px;text-align:center;margin:0;justify-content:center;flex:1}
main{padding-bottom:100px}.tb{padding:8px 12px}h2{font-size:26px}.login{grid-template-columns:1fr}.hero{padding:32px 24px;min-height:300px}}</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
/* ===== API layer: same routes/shapes as backend spec §4. Published pages cannot reach localhost, so
   call() is backed by an in-browser store. To use the real server, replace call() with fetch('/api'+path,
   {method, headers:{Authorization:'Bearer '+token}, body}) — nothing else changes. ===== */
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const META={crops:['wheat','rice','maize','cotton','soybean'],cropLabels:{wheat:'Wheat',rice:'Rice',maize:'Maize',cotton:'Cotton',soybean:'Soybean'},incomeSourceTypes:['Crop sale','Dairy','Wage labour','Remittance','Other'],expenseCategories:['Seeds','Fertiliser','Food','Health','Education','Labour','Other'],lenderTypes:['Bank','Cooperative','Moneylender','SHG'],irrigationTypes:['rainfed','borewell','canal']};
const PROJ=[{id:'solar',name:'Solar drip irrigation',budget:180000,skills:['Electrician'],eq:['Solar Pump'],gain:12000,maint:8000,hh:25},{id:'dairy',name:'Dairy cooperative',budget:120000,skills:['Veterinary'],eq:['Chilling Unit'],gain:9000,maint:6000,hh:30},{id:'mech',name:'Farm mechanisation hub',budget:250000,skills:['Mechanic'],eq:['Tractor'],gain:15000,maint:12000,hh:40},{id:'tail',name:'Tailoring unit',budget:80000,skills:['Tailoring'],eq:['Sewing Machine'],gain:6000,maint:3000,hh:12}];
const PRICE={wheat:2400,rice:2200,maize:2000,cotton:6500,soybean:4500},VOL={wheat:.08,rice:.1,maize:.15,cotton:.22,soybean:.18};
function seed(){let x=7;const r=()=>(x=x*16807%2147483647)/2147483647,d={hh:[],inc:[],exp:[],loans:[],crops:[],logs:[],nid:100,
res:[{id:1,resource_type:'Equipment',name:'Tractor',quantity_or_capacity:1,condition:'good'},{id:2,resource_type:'Equipment',name:'Solar Pump',quantity_or_capacity:0,condition:'n/a'},{id:3,resource_type:'Equipment',name:'Chilling Unit',quantity_or_capacity:0,condition:'n/a'},{id:4,resource_type:'Equipment',name:'Sewing Machine',quantity_or_capacity:4,condition:'fair'}],
skills:[{id:1,skill_name:'Electrician',person_count:1},{id:2,skill_name:'Veterinary',person_count:0},{id:3,skill_name:'Mechanic',person_count:2},{id:4,skill_name:'Tailoring',person_count:6}],meta:{shg_fund_available:250000,govt_scheme_budget:400000}};
[['Ramesh Yadav','Kheda'],['Sunita Devi','Kheda'],['Mohan Lal','Rampur'],['Geeta Bai','Rampur'],['Harish Patel','Kheda'],['Lakshmi Naik','Rampur']].forEach((n,i)=>{const id=i+1,ac=1+Math.round(r()*40)/10;
d.hh.push({id,head_name:n[0],village:n[1],family_size:3+i%4,land_acres:ac,irrigation_type:META.irrigationTypes[i%3]});
const base=9000+r()*9000;for(let m=0;m<12;m++){const dt=`2025-${String(m+1).padStart(2,'0')}-15`;
d.inc.push({id:d.nid++,household_id:id,date:dt,source_type:m%3?'Wage labour':'Crop sale',amount:Math.round(base*(m%3?.7:1.6))});
d.exp.push({id:d.nid++,household_id:id,date:dt,category:['Food','Seeds','Health','Education'][m%4],amount:Math.round(base*(.5+r()*.35))})}
if(i%2==0)d.loans.push({id:d.nid++,household_id:id,lender_type:i==4?'Moneylender':'Bank',principal:60000,interest_rate_pct:i==4?36:9,monthly_installment:i==4?4200:1800,start_date:'2025-01-01',months_remaining:18});
d.crops.push({id:d.nid++,household_id:id,crop_name:META.crops[i%5],sowing_month:6,acreage:ac,irrigation_type:d.hh[i].irrigation_type,expected_yield_quintal:Math.round(ac*14),cost_per_acre:14000})});return d}
let mem=null;const ld=()=>{try{const s=localStorage.getItem('rs2');if(s)return JSON.parse(s)}catch(e){}return mem||seed()};
const sv=d=>{mem=d;try{localStorage.setItem('rs2',JSON.stringify(d))}catch(e){}};
const sum=a=>a.reduce((s,x)=>s+x.amount,0);
function budget(d,id){const inc=d.inc.filter(x=>x.household_id==id),ex=d.exp.filter(x=>x.household_id==id),emi=d.loans.filter(x=>x.household_id==id).reduce((s,l)=>s+l.monthly_installment,0);
const ai=sum(inc)/12,ae=sum(ex)/12,net=ai-ae-emi,rate=ai?net/ai*100:0;
return{avgMonthlyIncome:ai,avgMonthlyExpense:ae,monthlyEmi:emi,netMonthly:net,savingsRatePct:rate,debtToIncomePct:ai?emi/ai*100:0,bufferStatus:rate>=15?'Healthy':rate>=5?'Watch':'At risk',
monthly:M.map((m,i)=>({m,income:inc.filter(x=>+x.date.slice(5,7)==i+1).reduce((s,x)=>s+x.amount,0),expense:ex.filter(x=>+x.date.slice(5,7)==i+1).reduce((s,x)=>s+x.amount,0)}))}}
function risk(d,id){const cs=d.crops.filter(c=>c.household_id==id),tot=cs.reduce((s,c)=>s+c.acreage,0)||1;
return{assessments:cs.map(c=>{const rev=c.expected_yield_quintal*PRICE[c.crop_name],cost=c.cost_per_acre*c.acreage,margin=rev-cost,rain=c.irrigation_type=='rainfed'?35:c.irrigation_type=='borewell'?15:8,
score=Math.min(100,Math.round(rain+VOL[c.crop_name]*150+(margin<0?25:0))),why=[];if(rain>30)why.push('Rain-dependent');if(VOL[c.crop_name]>.15)why.push('Volatile prices');if(margin<0)why.push('Negative margin');
return{crop:c.crop_name,acreage:c.acreage,irrigation:c.irrigation_type,expectedMargin:margin,riskScore:score,level:score>=60?'High':score>=35?'Medium':'Low',reasons:why}}),
concentration:cs.map(c=>({crop:c.crop_name,sharePct:Math.round(c.acreage/tot*100)}))}}
function feas(d,ov){const sk=Object.fromEntries(d.skills.map(s=>[s.skill_name,s.person_count])),eq=Object.fromEntries(d.res.filter(r=>r.resource_type=='Equipment').map(r=>[r.name,r.quantity_or_capacity]));
Object.assign(sk,ov?.skills||{});Object.assign(eq,ov?.equipment||{});const bud=ov?.budget??(d.meta.shg_fund_available+d.meta.govt_scheme_budget);
return PROJ.map(p=>{const ms=p.skills.filter(s=>!sk[s]),me=p.eq.filter(e=>!eq[e]),bo=p.budget<=bud,n=(bo?0:1)+ms.length+me.length,net=(p.gain-p.maint/12)*12;
return{id:p.id,name:p.name,requiredBudget:p.budget,beneficiaries:p.hh,annualNetGain:net,paybackMonths:Math.round(p.budget/(p.gain-p.maint/12)),budgetOk:bo,missingSkills:ms,missingEquipment:me,status:n?(n>1?'Blocked':'Partly ready'):'Feasible',score:(n?0:1000)+net*p.hh/p.budget}}).sort((a,b)=>b.score-a.score)}
const log=(d,f,h)=>{d.logs.unshift({id:d.nid++,household_id:h??null,feature:f,created_at:new Date().toISOString()});d.logs=d.logs.slice(0,50)};
async function call(m,p,b){const d=ld();let x;const bad=e=>{throw new Error(e)};
if(m=='GET'&&p=='/households')return d.hh.map(h=>{const t=budget(d,h.id);return{...h,savingsRatePct:t.savingsRatePct,bufferStatus:t.bufferStatus}});
if(m=='POST'&&p=='/households'){if(!b.head_name||!b.village||!(b.family_size>0)||!(b.land_acres>=0))bad('Please fill all household fields');const h={id:d.hh.length+1,...b};d.hh.push(h);sv(d);return h}
if(x=p.match(/^\/households\/(\d+)\/(\w+(?:-\w+)?)$/)){const id=+x[1],k=x[2];
if(m=='GET'&&k=='records')return{income:d.inc.filter(r=>r.household_id==id),expenses:d.exp.filter(r=>r.household_id==id),loans:d.loans.filter(r=>r.household_id==id),crops:d.crops.filter(r=>r.household_id==id)};
if(m=='GET'&&k=='budget'){log(d,'budget',id);sv(d);return budget(d,id)}
if(m=='GET'&&k=='crop-risk'){log(d,'crop-risk',id);sv(d);return risk(d,id)}
const t={income:'inc',expenses:'exp',loans:'loans',crops:'crops'}[k];
if(m=='POST'&&t){for(const v of Object.values(b))if(v===''||v==null||(typeof v=='number'&&isNaN(v)))bad('Please fill every field');const r={id:d.nid++,household_id:id,...b};d[t].push(r);sv(d);return r}}
if(p=='/village/dashboard'){const bs=d.hh.map(h=>({h,b:budget(d,h.id)})),mix={};d.inc.forEach(r=>mix[r.source_type]=(mix[r.source_type]||0)+r.amount);
return{kpis:{households:d.hh.length,avgMonthlyIncome:bs.reduce((s,x)=>s+x.b.avgMonthlyIncome,0)/bs.length,avgSavingsRatePct:bs.reduce((s,x)=>s+x.b.savingsRatePct,0)/bs.length,overIndebted:bs.filter(x=>x.b.debtToIncomePct>25).length},
incomeMix:Object.entries(mix).map(([k,v])=>({source:k,amount:v})),cashFlow:M.map((mm,i)=>({m:mm,income:d.inc.filter(r=>+r.date.slice(5,7)==i+1).reduce((s,r)=>s+r.amount,0),expense:d.exp.filter(r=>+r.date.slice(5,7)==i+1).reduce((s,r)=>s+r.amount,0)})),
overIndebtedList:bs.filter(x=>x.b.debtToIncomePct>25).map(x=>({id:x.h.id,head_name:x.h.head_name,debtToIncomePct:x.b.debtToIncomePct}))}}
if(m=='GET'&&p=='/village/resources')return{resources:d.res,skills:d.skills,...d.meta};
if(x=p.match(/^\/village\/(resources|skills)\/(\d+)$/)){const o=d[x[1]=='skills'?'skills':'res'].find(r=>r.id==x[2]);if(!o)bad('Not found');
if(x[1]=='skills'){if(!(b.person_count>=0))bad('Invalid count');o.person_count=+b.person_count}else{if(b.quantity_or_capacity!=null)o.quantity_or_capacity=+b.quantity_or_capacity;if(b.condition)o.condition=b.condition}sv(d);return o}
if(m=='GET'&&p=='/consultancy/projects'){log(d,'consultancy');sv(d);return feas(d)}
if(m=='POST'&&p=='/consultancy/simulate')return feas(d,b);
if(p=='/advisory-logs')return d.logs.slice(0,10);
bad('Unknown route')}
/* ===== UI ===== */
const $=s=>document.querySelector(s),fm=n=>'₹'+Math.round(n).toLocaleString('en-IN'),pc=n=>n.toFixed(1)+'%',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const S={auth:false,page:'hh',hid:null,tab:'records'};
const toast=t=>{const e=$('#toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',2200)};
const pill=s=>`<span class="pill ${/risk|High|Blocked/i.test(s)?'b':/Watch|Medium|Partly/.test(s)?'w':''}">${s}</span>`;
function bars(rows){const mx=Math.max(1,...rows.flatMap(r=>[r.income,r.expense])),W=600,w=(W-42)/rows.length,g=[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${160-f*140}" y2="${160-f*140}" stroke="var(--bd)"/><text x="0" y="${154-f*140}" font-size="9" fill="var(--mut)">${f?fm(mx*f):''}</text>`).join('');
return`<div class="sc"><svg viewBox="0 0 ${W} 190" style="min-width:460px;width:100%;height:auto;max-height:250px">${g}${rows.map((r,i)=>{const a=r.income/mx*140,c=r.expense/mx*140,x=42+i*w+w/2;return`<g><title>${r.m}: income ${fm(r.income)}, expense ${fm(r.expense)}</title><rect x="${x-11}" y="${160-a}" width="10" height="${a}" rx="3" fill="var(--pri)"/><rect x="${x+1}" y="${160-c}" width="10" height="${c}" rx="3" fill="var(--acc)"/><text x="${x}" y="178" font-size="10" text-anchor="middle" fill="var(--mut)">${r.m}</text></g>`}).join('')}</svg></div><small class="mut"><span style="color:var(--pri)">●</span> Income &nbsp;<span style="color:var(--acc)">●</span> Expense</small>`}
const fld=(n,l,t='text',o)=>`<div><label>${l}</label>${o?`<select name="${n}">${o.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input name="${n}" type="${t}"${t=='number'?' step="any"':''}>`}</div>`;
const table=(h,rows)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td class="mut" colspan="${h.length}">No data</td></tr>`}</table></div>`;
function shell(body){$('#app').innerHTML=`<div class="app"><aside><div class="brand">🌾<div>RuralSaathi<small>Village finance companion</small></div></div><nav>${[['hh','🏡','Households'],['vd','📊','Village'],['vr','🧰','Resources'],['co','💡','Consultancy']].map(([k,i,l])=>`<button class="nb ${S.page==k||(S.page=='hp'&&k=='hh')?'on':''}" data-nav="${k}"><span>${i}</span>${l}</button>`).join('')}</nav><button class="nb out" data-act="out"><span>👋</span>Sign out</button></aside><main class="${S.rise?'rise':''}">${body}</main></div>`}
async function render(){if(!S.auth){$('#app').innerHTML=`<div class="login"><div class="hero"><svg viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice"><circle cx="450" cy="105" r="54" fill="#d48a1f"/><path d="M0 215Q150 145 300 205T600 185V300H0Z" fill="#2c7a4b"/><path d="M0 262Q170 205 330 252T600 238V300H0Z" fill="#164a2d"/></svg><h1>Every household, every harvest.</h1><p>Budgets, crop risk and village planning in one calm place.</p><p>Built for field operators.</p></div><div class="pane"><div><h2>Welcome back</h2><p class="mut">Sign in to review households and plan village projects.</p><button class="btn" data-act="in">Enter as demo operator</button><small class="mut">Demo mode — no password needed.</small></div></div></div>`;return}
try{await PAGES[S.page]();S.rise=false}catch(e){shell(`<div class="card">Error: ${esc(e.message)}</div>`)}}
const PAGES={
async hh(){const l=await call('GET','/households');shell(`<h2>Households</h2><div class="banner"><div><div class="bt">${l.length} households in your care</div><div>${l.filter(h=>h.bufferStatus=='At risk').length} need attention · ${l.filter(h=>h.bufferStatus=='Healthy').length} are healthy</div></div><input id="q" placeholder="Search name or village…" aria-label="Search households"></div><div class="tabs">${['All','At risk','Watch','Healthy'].map((f,i)=>`<button class="tb ${i?'':'on'}" data-fl="${f}">${f}</button>`).join('')}</div><div class="card"><details><summary>+ Add household</summary><form data-f="hh">${fld('head_name','Head of household')}${fld('village','Village')}${fld('family_size','Family size','number')}${fld('land_acres','Land (acres)','number')}${fld('irrigation_type','Irrigation','',META.irrigationTypes)}<button class="btn">Save</button></form></details></div>
<div class="grid3">${l.map(h=>`<div class="hc" data-open="${h.id}" data-n="${esc((h.head_name+' '+h.village).toLowerCase())}" data-b="${h.bufferStatus}"><div class="hc-top"><div class="av">${ini(h.head_name)}</div><div><b>${esc(h.head_name)}</b><small>📍 ${esc(h.village)}</small></div></div><div class="chips"><span class="chip">${h.land_acres} ac</span><span class="chip">${h.irrigation_type}</span><span class="chip">Family of ${h.family_size}</span></div><div class="hc-foot"><div><small class="mut">Buffer</small><br>${pill(h.bufferStatus)}</div><div class="ring" style="--p:${Math.max(0,Math.min(100,h.savingsRatePct*2.5))}" title="Savings rate"><i>${Math.round(h.savingsRatePct)}%</i></div></div></div>`).join('')}</div>`)},
async hp(){const hs=await call('GET','/households'),h=hs.find(x=>x.id==S.hid),id=S.hid;let b='';
if(S.tab=='records'){const r=await call('GET',`/households/${id}/records`);
const F=(k,t,fs)=>`<details><summary>+ Add ${t}</summary><form data-f="${k}">${fs}<button class="btn">Save</button></form></details>`;
b=`<div class="card">${F('income','income',fld('date','Date','date')+fld('source_type','Source','',META.incomeSourceTypes)+fld('amount','Amount (₹)','number'))}${F('expenses','expense',fld('date','Date','date')+fld('category','Category','',META.expenseCategories)+fld('amount','Amount (₹)','number'))}${F('loans','loan',fld('lender_type','Lender','',META.lenderTypes)+fld('principal','Principal','number')+fld('interest_rate_pct','Interest %','number')+fld('monthly_installment','Monthly EMI','number')+fld('start_date','Start','date')+fld('months_remaining','Months left','number'))}${F('crops','crop',fld('crop_name','Crop','',META.crops)+fld('sowing_month','Sowing month (1-12)','number')+fld('acreage','Acres','number')+fld('irrigation_type','Irrigation','',META.irrigationTypes)+fld('expected_yield_quintal','Yield (qtl)','number')+fld('cost_per_acre','Cost / acre','number'))}</div>
<div class="card"><h3>Income</h3>${table(['Date','Source','Amount'],r.income.slice(-8).reverse().map(x=>[x.date,x.source_type,fm(x.amount)]))}</div><div class="card"><h3>Expenses</h3>${table(['Date','Category','Amount'],r.expenses.slice(-8).reverse().map(x=>[x.date,x.category,fm(x.amount)]))}</div><div class="card"><h3>Loans</h3>${table(['Lender','Principal','Rate','EMI','Months left'],r.loans.map(x=>[x.lender_type,fm(x.principal),x.interest_rate_pct+'%',fm(x.monthly_installment),x.months_remaining]))}</div><div class="card"><h3>Crops</h3>${table(['Crop','Acres','Irrigation','Yield'],r.crops.map(x=>[META.cropLabels[x.crop_name],x.acreage,x.irrigation_type,x.expected_yield_quintal+' qtl']))}</div>`}
if(S.tab=='budget'){const t=await call('GET',`/households/${id}/budget`);b=`<div class="grid">${[['Avg income / mo',fm(t.avgMonthlyIncome)],['Avg expense / mo',fm(t.avgMonthlyExpense)],['Loan EMI / mo',fm(t.monthlyEmi)],['Net / mo',fm(t.netMonthly)],['Savings rate',pc(t.savingsRatePct)],['Debt-to-income',pc(t.debtToIncomePct)]].map(([a,c])=>`<div class="kpi"><small>${a}</small><div>${c}</div></div>`).join('')}</div><div class="card"><h3>Buffer status: ${pill(t.bufferStatus)}</h3>${bars(t.monthly)}</div>`}
if(S.tab=='risk'){const t=await call('GET',`/households/${id}/crop-risk`);b=`<div class="card"><h3>Crop risk</h3>${table(['Crop','Acres','Expected margin','Risk','Why'],t.assessments.map(a=>[META.cropLabels[a.crop],a.acreage,fm(a.expectedMargin),pill(a.level)+' '+a.riskScore,a.reasons.join(', ')||'—']))}</div><div class="card"><h3>Acreage concentration</h3>${t.concentration.map(c=>`<div>${META.cropLabels[c.crop]} ${c.sharePct}%<div class="bar"><i style="width:${c.sharePct}%"></i></div></div>`).join('')}</div>`}
shell(`<button class="btn g" data-nav="hh">← All households</button><div class="ph"><div class="av lg">${ini(h.head_name)}</div><div><h2>${esc(h.head_name)}</h2><div class="chips"><span class="chip">📍 ${esc(h.village)}</span><span class="chip">${h.land_acres} ac</span><span class="chip">Family of ${h.family_size}</span><span class="chip">${h.irrigation_type}</span></div></div><div style="margin-left:auto">${pill(h.bufferStatus)}</div></div><div class="tabs">${[['records','Records'],['budget','Budget'],['risk','Crop risk']].map(([k,l])=>`<button class="tb ${S.tab==k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>${b}`)},
async vd(){const v=await call('GET','/village/dashboard'),k=v.kpis,mx=Math.max(...v.incomeMix.map(x=>x.amount));shell(`<h2>Village dashboard</h2><p class="sub">How the whole village is earning, spending and saving across the year.</p><div class="grid">${[['Households',k.households],['Avg income / mo',fm(k.avgMonthlyIncome)],['Avg savings rate',pc(k.avgSavingsRatePct)],['Over-indebted',k.overIndebted]].map(([a,c])=>`<div class="kpi"><small>${a}</small><div>${c}</div></div>`).join('')}</div><div class="card"><h3>12-month cash flow</h3>${bars(v.cashFlow)}</div><div class="card"><h3>Income mix</h3>${v.incomeMix.map(x=>`<div>${x.source} <span class="mut">${fm(x.amount)}</span><div class="bar"><i style="width:${x.amount/mx*100}%"></i></div></div>`).join('')}</div><div class="card"><h3>Over-indebted households</h3>${table(['Household','Debt-to-income'],v.overIndebtedList.map(x=>[`<a href="#" data-open="${x.id}">${esc(x.head_name)}</a>`,pc(x.debtToIncomePct)]))}</div>`)},
async vr(){const v=await call('GET','/village/resources');shell(`<h2>Village resources</h2><p class="sub">Shared equipment, skills and funds. Edits save automatically.</p><div class="grid"><div class="kpi"><small>SHG fund</small><div>${fm(v.shg_fund_available)}</div></div><div class="kpi"><small>Govt scheme budget</small><div>${fm(v.govt_scheme_budget)}</div></div></div><div class="card"><h3>Resources</h3>${table(['Name','Qty / capacity','Condition'],v.resources.map(r=>[r.name,`<input type="number" min="0" value="${r.quantity_or_capacity}" data-res="${r.id}" data-k="quantity_or_capacity">`,`<select data-res="${r.id}" data-k="condition">${['good','fair','poor','n/a'].map(c=>`<option${c==r.condition?' selected':''}>${c}</option>`).join('')}</select>`]))}</div><div class="card"><h3>Skills (people)</h3>${table(['Skill','People'],v.skills.map(s=>[s.skill_name,`<input type="number" min="0" value="${s.person_count}" data-skill="${s.id}">`]))}</div>`)},
async co(){const [p,v,lg]=await Promise.all([call('GET','/consultancy/projects'),call('GET','/village/resources'),call('GET','/advisory-logs')]);
shell(`<h2>Consultancy</h2><p class="sub">See which village projects are ready to launch, and test what would unlock the rest.</p><div class="card"><h3>Ranked projects (from saved data)</h3>${res(p)}</div><div class="card"><h3>What-if simulator <span class="mut" style="font-weight:400">— not saved</span></h3><form data-f="sim">${fld('budget','Budget (₹)','number').replace('name="budget"',`name="budget" value="${v.shg_fund_available+v.govt_scheme_budget}"`)}${v.skills.map(s=>fld('s_'+s.skill_name,s.skill_name+' (people)','number').replace('<input',`<input value="${s.person_count}"`)).join('')}${v.resources.filter(r=>r.resource_type=='Equipment').map(r=>fld('e_'+r.name,r.name+' (units)','number').replace('<input',`<input value="${r.quantity_or_capacity}"`)).join('')}<button class="btn">Simulate</button></form><div id="sim" style="margin-top:12px"></div></div><div class="card"><h3>Recent advisory activity</h3>${table(['Feature','When'],lg.map(l=>[l.feature,new Date(l.created_at).toLocaleString()]))}</div>`)}};
const res=p=>`<div class="grid3">${p.map(x=>{const ck=(o,t)=>`<div>${o?'✅':'⬜'} ${t}</div>`;return`<div class="hc st"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><b style="font-size:16px">${x.name}</b>${pill(x.status)}</div><div class="mut">${fm(x.requiredBudget)} needed · pays back in ${x.paybackMonths} months</div><div>${ck(x.budgetOk,x.budgetOk?'Budget covered':'Budget short')}${x.missingSkills.map(k=>ck(0,'Skill needed: '+k)).join('')}${x.missingEquipment.map(k=>ck(0,'Equipment needed: '+k)).join('')}${x.missingSkills.length+x.missingEquipment.length?'':ck(1,'Skills and equipment ready')}</div><div><small class="mut">Net gain per year</small><div style="font:600 22px Fraunces,Georgia,serif">${fm(x.annualNetGain)}</div><small class="mut">${x.beneficiaries} households benefit</small></div></div>`}).join('')}</div>`;
document.addEventListener('click',e=>{const t=e.target.closest('[data-nav],[data-tab],[data-open],[data-act]');if(!t)return;e.preventDefault();const D=t.dataset;
if(D.act=='in')S.auth=true;if(D.act=='out')S.auth=false;if(D.nav){S.page=D.nav}S.rise=!!(D.nav||D.open||D.act);if(D.tab)S.tab=D.tab;if(D.open){S.hid=+D.open;S.page='hp';S.tab='records'}render()});
function filt(){const q=($('#q')?.value||'').toLowerCase(),f=document.querySelector('[data-fl].on')?.dataset.fl||'All';document.querySelectorAll('.hc[data-n]').forEach(c=>c.style.display=(f=='All'||c.dataset.b==f)&&c.dataset.n.includes(q)?'':'none')}
document.addEventListener('input',e=>{if(e.target.id=='q')filt()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-fl]');if(!b)return;document.querySelectorAll('[data-fl]').forEach(x=>x.classList.toggle('on',x==b));filt()});
document.addEventListener('change',async e=>{const t=e.target,D=t.dataset;try{if(D.res)await call('PATCH','/village/resources/'+D.res,{[D.k]:t.value});else if(D.skill)await call('PATCH','/village/skills/'+D.skill,{person_count:t.value});else return;toast('Saved')}catch(x){toast(x.message)}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,k=f.dataset.f,o=Object.fromEntries(new FormData(f));
for(const n in o)if(f.elements[n].type=='number')o[n]=o[n]===''?NaN:+o[n];
try{if(k=='sim'){const b={budget:o.budget,skills:{},equipment:{}};for(const n in o){if(n[0]=='s'&&n[1]=='_')b.skills[n.slice(2)]=o[n];if(n[0]=='e'&&n[1]=='_')b.equipment[n.slice(2)]=o[n]}$('#sim').innerHTML=res(await call('POST','/consultancy/simulate',b));return}
if(k=='hh')await call('POST','/households',o);else await call('POST',`/households/${S.hid}/${k}`,o);toast('Saved — persisted in browser store');render()}catch(x){toast(x.message)}});
render();
</script></body></html>
